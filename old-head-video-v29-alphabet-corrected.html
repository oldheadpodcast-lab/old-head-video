let collectionView='details',pendingWatch=null;
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(state.movies)||!Array.isArray(state.paths))throw Error()}catch(e){state=initial()}
state.deferred=Array.isArray(state.deferred)?state.deferred:[];
let tmdbModal=null,tmdbPage=1,tmdbTotalPages=1,tmdbGenreMap={},tmdbDraft=null,addDraft=null;let historyEditId=null,historyDraft=null,tmdbCandidates=[],tmdbTarget=null,tmdbBusy=false,tmdbStop=false,tmdbStatus='',tmdbSearchText='',tmdbReviewOnly=false;let tab='Home',query='',collectionFilter='all',editId=null,editPathId=null,editPathIds=[],pathSearch='',notice='',ratingPromptId=null,swapTarget=null;const tabs=['Home','Up Next','Collection','Add VHS','History','Viewing Paths','Movie Info','Backup'];
const movie=id=>state.movies.find(m=>m.id===id)||(state.archivedMovies||[]).find(m=>m.id===id);

function active(){return state.paths.filter(p=>p.active)}
function isMusic(m){return /music|concert|punk|rock|metal|video clip/i.test(m.genre||'')}

function eligibleQueueMovies(){const normal=state.movies.filter(m=>!m.watched&&!state.deferred.includes(m.id));if(normal.length)return normal;const waiting=state.deferred.map(movie).filter(m=>m&&!m.watched);return waiting.length?waiting:state.movies.filter(m=>!m.watched)}
function moveToBack(id){let m=movie(id),pos=state.lineup.indexOf(id);if(!m||m.watched||pos<0)return;if(isProtected(id)){notice='This movie is protected by an active Viewing Path.';render();return}if(!state.deferred.includes(id))state.deferred.push(id);const used=new Set(state.lineup);const replacement=eligibleQueueMovies().find(x=>!used.has(x.id));if(replacement)state.lineup[pos]=replacement.id;else state.lineup.splice(pos,1);state.completed=state.completed.filter(x=>x!==id);shelfDetailId=null;swapTarget=null;save();notice=m.title+' moved to the back of the rotation. It will return after the other unwatched titles. Skipped titles keep their order.';render()}
function sortTitle(title){return String(title||'').replace(/^(?:the|a)\s+/i,'').trim()}
function compareMovieTitles(a,b){return sortTitle(a.title).localeCompare(sortTitle(b.title),undefined,{sensitivity:'base',numeric:true})||a.title.localeCompare(b.title)}
function sortedHistory(){return state.history.slice().sort((a,b)=>{const da=a.date||'',db=b.date||'';return db.localeCompare(da)||state.history.indexOf(a)-state.history.indexOf(b)})}
function creditsHtml(m){return `${m.tmdbDirector?`<p><b>Director:</b> ${esc(m.tmdbDirector)}</p>`:''}${m.tmdbStars?.length?`<p><b>Starring:</b> ${esc(m.tmdbStars.join(', '))}</p>`:''}`}
function applyCredits(m,x){if(!x?.credits)return;m.tmdbDirector=(x.credits.crew||[]).filter(p=>p.job==='Director').map(p=>p.name).join(', ');m.tmdbStars=(x.credits.cast||[]).slice(0,5).map(p=>p.name)}
function makeLineup(force=false){if(!force&&state.lineup.length&&state.completed.length<state.lineup.length)return;let available=eligibleQueueMovies(),picked=[],used=new Set(),paths=active();const ordered=p=>p.ids.map(movie).filter(m=>m&&!m.watched&&!state.deferred.includes(m.id)).sort((a,b)=>(Number(a.year)||9999)-(Number(b.year)||9999));for(const p of paths){let next=ordered(p).find(m=>!used.has(m.id));if(next&&picked.length<10&&(!isMusic(next)||!picked.some(isMusic))){picked.push(next);used.add(next.id)}}
if(!state.movies.some(m=>!m.watched&&!state.deferred.includes(m.id))){state.lineup=available.slice(0,10).map(m=>m.id);state.completed=[];state.round++;save();return}
const musicAvailable=available.some(isMusic);if(musicAvailable&&!picked.some(isMusic)&&picked.length<10){let music=available.filter(m=>isMusic(m)&&!used.has(m.id));let chosen=music[Math.floor(Math.random()*music.length)];if(chosen){picked.push(chosen);used.add(chosen.id)}}const seenGenre={},seenDecade={};for(const m of picked){seenGenre[bucket(m)]=(seenGenre[bucket(m)]||0)+1;seenDecade[Math.floor(Number(m.year)/10)*10]=(seenDecade[Math.floor(Number(m.year)/10)*10]||0)+1}
while(picked.length<10){let options=available.filter(m=>!used.has(m.id)&&(!isMusic(m)||!picked.some(isMusic)));if(!options.length)break;let best=null,bestScore=-Infinity;for(const m of options){let g=bucket(m),d=Math.floor(Number(m.year)/10)*10,prev=picked.at(-1),related=state.history.filter(h=>h.rating>=4).map(h=>movie(h.id)).filter(Boolean),affinity=related.some(x=>bucket(x)===g)?1.8:0,score=Math.random()*3+affinity-(seenGenre[g]||0)*4-(seenDecade[d]||0)*1.5-(prev&&bucket(prev)===g?7:0);if(score>bestScore){best=m;bestScore=score}}picked.push(best);used.add(best.id);seenGenre[bucket(best)]=(seenGenre[bucket(best)]||0)+1;seenDecade[Math.floor(Number(best.year)/10)*10]=(seenDecade[Math.floor(Number(best.year)/10)*10]||0)+1}
state.lineup=picked.map(m=>m.id);state.completed=[];state.round++;save()}
if(!state.lineup.length)makeLineup();
function startNewRotation(){
 const selected=document.querySelector('input[name="rotationScope"]:checked');
 const scope=selected?.value==='all'?'all':'unwatched';
 const eligibleCount=scope==='all'?state.movies.length:state.movies.filter(m=>!m.watched).length;
 if(!eligibleCount){alert('There are no unwatched movies available. Choose All Movies to include previously watched titles.');return}
 const scopeText=scope==='all'?'all movies, including previously watched titles':'only movies currently marked unwatched';
 if(!confirm(`Start a new randomized rotation using ${scopeText}? This clears the current lineup and deferred queue, but preserves your collection, artwork, ratings, watch history, and viewing paths. Continue?`))return;
 // Reset rotation state only. In All Movies mode, clear watched flags to restore eligibility;
 // historical watch records, dates and ratings remain untouched in either mode.
 if(scope==='all')state.movies.forEach(m=>{m.watched=false});
 state.lineup=[];
 state.completed=[];
 state.deferred=[];
 state.round=0;
 makeLineup(true);
 shelfDetailId=null;swapTarget=null;ratingPromptId=null;pendingWatch=null;
 notice=`New rotation started with ${scope==='all'?'all movies':'unwatched movies only'}! Collection, artwork, ratings, watch history, and viewing paths were preserved.`;
 setTab('Up Next');
}
function newLineup(){if(!confirm('Replace the entire current lineup with 10 new recommendations? This will not mark any movies as watched or change Watch History.'))return;makeLineup(true);swapTarget=null;notice='A new lineup of up to 10 unwatched titles is ready.';render()}
function setTab(t){scrollPositions[tab]=window.scrollY;shelfDetailId=null;historyEditId=null;historyDraft=null;swapTarget=null;tab=t;query='';editId=null;editPathId=null;pathSearch='';returnPosition=null;render();restorePosition({tab:t,y:scrollPositions[t]||0})}
function todayLocal(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function updateWatchDate(id,value){let h=state.history.find(x=>x.id===id);if(!h)return;if(value&&!/^\d{4}-\d{2}-\d{2}$/.test(value))return;h.date=value||null;h.previously=!value;save();render()}
function commitMark(id){let m=movie(id);if(!m||m.watched)return;m.watched=true;if(!state.completed.includes(id))state.completed.push(id);state.history.unshift({id,date:todayLocal(),rating:m.rating||0});ratingPromptId=id;save();render()}
function commitMarkFromCollection(id){let m=movie(id);if(!m)return;let entry={id,date:todayLocal(),rating:0,entryId:'watch'+Date.now()+Math.random().toString(36).slice(2)};state.history.unshift(entry);m.watched=true;if(state.lineup.includes(id)&&!state.completed.includes(id))state.completed.push(id);ratingPromptId=id;save();render()}
function commitMarkPreviously(id){let m=movie(id);if(!m||m.watched)return;m.watched=true;state.history.unshift({id,date:null,previously:true,rating:m.rating||0});if(state.lineup.includes(id)&&!state.completed.includes(id))state.completed.push(id);ratingPromptId=id;save();render()}
function mark(id){requestWatch(id,'lineup')}
function markFromCollection(id){requestWatch(id,'collection')}
function markPreviously(id){requestWatch(id,'previous')}
function requestWatch(id,source){if(!movie(id))return;shelfDetailId=null;pendingWatch={id,source};render()}
function cancelWatch(){pendingWatch=null;render()}
function confirmWatch(){const pending=pendingWatch;pendingWatch=null;if(!pending)return;
 if(pending.source==='collection')commitMarkFromCollection(pending.id);
 else if(pending.source==='previous')commitMarkPreviously(pending.id);
 else commitMark(pending.id);
}
function renderWatchConfirmation(){if(!pendingWatch)return '';const m=movie(pendingWatch.id);if(!m)return '';
 const previously=pendingWatch.source==='previous';return `<div class="watch-confirm-backdrop" role="presentation" onclick="if(event.target===this)cancelWatch()"><div class="watch-confirm-panel" role="dialog" aria-modal="true" aria-label="Confirm watched movie"><h2>${previously?'Mark as Previously Watched?':'Mark as Watched?'}</h2><p> ${esc(m.title)} </p><p class="muted">${previously?'This will add the movie to your watch history without a watch date.':'This will add a watch entry and update your rotation if the movie is in your lineup.'} You can choose a rating afterward.</p><div class="actions"><button class="primary" onclick="confirmWatch()">${previously?'Confirm Previously Watched':'Confirm Watched'}</button><button onclick="cancelWatch()">Cancel</button></div></div></div>`;

function nextInPath(p){return sortPathIds(p.ids).map(movie).find(m=>m&&!m.watched)}
function finishRating(n){const id=ratingPromptId;if(id&&n>0)rate(id,n);ratingPromptId=null;render();if(id){const h=state.history.find(x=>x.id===id);if(h)askSharePoster(h.entryId||h.id)}}
function askSharePoster(key){const el=document.createElement('div');el.className='tmdb-modal';el.innerHTML='<div class="tmdb-dialog" style="max-width:420px;text-align:center"><h2>Create a shareable poster?</h2><p class="muted">Your original movie poster and star rating, in the black, yellow, and silver style.</p><div class="actions" style="justify-content:center"><button class="primary" id="shareYes">Create Poster</button><button id="shareNo">Not Now</button></div></div>';document.body.appendChild(el);el.querySelector('#shareYes').onclick=()=>{el.remove();shareWatch(key)};el.querySelector('#shareNo').onclick=()=>el.remove()}

function rate(id,n){let m=movie(id);if(!m)return;m.rating=n;let h=state.history.find(x=>x.id===id);if(h)h.rating=n;save();render()}
function isProtected(id){return active().some(p=>p.ids.includes(id))}
function swapStart(id){if(isProtected(id)){notice='This movie is protected by an active Viewing Path.';render();return}swapTarget=swapTarget===id?null:id;render()}
function swapMovie(id,mode){let pos=state.lineup.indexOf(id);if(pos<0||isProtected(id)||movie(id)?.watched){swapTarget=null;render();return}let used=new Set(state.lineup),chosen=null;
if(mode==='path'){let paths=active(),cursor=Number(state.pathSwapCursor)||0;for(let offset=0;offset<paths.length;offset++){let index=(cursor+offset)%paths.length,p=paths[index],candidate=nextInPath(p);if(candidate&&!used.has(candidate.id)){chosen=candidate;state.pathSwapCursor=(index+1)%paths.length;break}}if(!chosen){notice='No eligible next movie is available from an active Viewing Path. Try Random instead.';render();return}}
else{let original=movie(id),options=state.movies.filter(m=>!m.watched&&!used.has(m.id)&&!isProtected(m.id));if(!options.length){notice='No eligible movies are available to swap in.';render();return}let related=state.history.filter(h=>h.rating>=4).map(h=>movie(h.id)).filter(Boolean),others=state.lineup.filter(x=>x!==id).map(movie).filter(Boolean),bestScore=-Infinity;for(let m of options){let g=bucket(m),score=Math.random()*3+(g===bucket(original)?5:0)+(related.some(x=>bucket(x)===g)?1.8:0)-others.filter(x=>bucket(x)===g).length*1.2;if(score>bestScore){bestScore=score;chosen=m}}}
state.lineup[pos]=chosen.id;swapTarget=null;save();notice='Swapped '+movie(id).title+' for '+chosen.title+'. The original remains unwatched.';render()}
function posterHtml(m){let p=m.posterOverride||(m.posterPath?'https://image.tmdb.org/t/p/w185'+m.posterPath:'');return p?`<img loading="lazy" src="${esc(p)}" alt="Poster for ${esc(m.title)}" onerror="this.replaceWith(document.createTextNode('▣'))">`:'▣'}

let dashboardSlide=0;
const posterOf=m=>m?.posterOverride||(m?.posterPath?'https://image.tmdb.org/t/p/w342'+m.posterPath:'');
function dashboardPoster(m,label=''){
 if(!m)return `<div class="dash-poster empty-poster"><span>COMING SOON</span></div>`;
 const url=posterOf(m);
 return `<div class="dash-poster">${url?`<img src="${esc(url)}" alt="${esc(m.title)} poster" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="poster-fallback" style="display:${url?'none':'block'}">${esc(m.title)}</span>${label?`<div class="poster-caption">${esc(label)}</div>`:''}</div>`;

function rotatePick(arr,n=3,offset=0){if(!arr.length)return [];let unique=[...new Map(arr.filter(Boolean).map(m=>[m.id,m])).values()];return Array.from({length:Math.min(n,unique.length)},(_,i)=>unique[(offset+i)%unique.length])}
function dashboardPanel(title,tabName,desc,items,extra=''){
 return `<section class="dash-panel" role="region" aria-label="${esc(title)}"><div class="dash-panel-head"><div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div><button class="dash-open" onclick="setTab('${tabName}')">Open →</button></div><div class="dash-posters">${items.length?items.map(x=>dashboardPoster(x.m,x.label||'')).join(''):'<div class="dash-empty">Nothing here yet. Open this section to get started.</div>'}</div>${extra}</section>`;
}
function renderDashboard(){
 const queue=state.lineup.filter(id=>!state.completed.includes(id)).map(movie).filter(m=>m&&!m.watched);
 const current=queue[0]||null;
 const upcoming=queue.slice(1);
 const collection=state.movies.filter(m=>!!posterOf(m));
 const watched=sortedHistory().map(h=>movie(h.id)).filter(Boolean);
 const paths=state.paths.filter(p=>p.ids?.length);
 const pathShow=rotatePick(paths,3,dashboardSlide).map(p=>({m:rotatePick(p.ids.map(movie).filter(Boolean),1,dashboardSlide)[0],label:p.name})).filter(x=>x.m);
 const qItems=rotatePick(upcoming,3,dashboardSlide).map(m=>({m}));
 const cItems=rotatePick(collection,3,(dashboardSlide*3)%Math.max(1,collection.length)).map(m=>({m}));
 const hItems=rotatePick(watched,3,dashboardSlide).map(m=>({m}));
 const director=current?.tmdbDirector||'';
 const stars=Array.isArray(current?.tmdbStars)?current.tmdbStars.join(', '):current?.tmdbStars||'';
 return `<div class="dash-intro"><div class="dash-eyebrow">WELCOME BACK TO YOUR VIDEO STORE</div></div>
 <section class="dash-feature"><div class="dash-feature-copy"><div class="dash-eyebrow">NOW SHOWING</div><h2>${current?esc(current.title):'Your next movie awaits'}</h2>${current?`<p class="dash-meta">${esc(current.year||'')} · ${esc(current.genre||'Movie')}</p>${director?`<p><b>Director:</b> ${esc(director)}</p>`:''}${stars?`<p><b>Starring:</b> ${esc(stars)}</p>`:''}`:'<p>Generate a lineup to get started.</p>'}<div class="dash-feature-actions"><button class="primary" onclick="${current?`mark('${esc(current.id)}')`:`setTab('Up Next')`}">${current?'Mark as Watched':'Open Up Next'}</button>${current?`<button onclick="openHomeMovieDetails('${esc(current.id)}')">Movie Details</button>`:''}</div></div><div class="dash-feature-art">${dashboardPoster(current)}</div></section>
 <div class="dash-grid">${dashboardPanel('UP NEXT','Up Next',`${upcoming.length} more movies in the current lineup`,qItems)}${dashboardPanel('MY COLLECTION','Collection',`${state.movies.length} movies on your shelves`,cItems)}${dashboardPanel('WATCH HISTORY','History',`${state.history.length} watch entries`,hItems)}${dashboardPanel('VIEWING PATHS','Viewing Paths',`${paths.length} curated paths`,pathShow)}</div>
 <div class="dash-rewind">BE KIND, REWIND ◀◀</div>`;
}

function posterFileData(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('Could not read the selected image.'));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('The selected file is not a readable image.'));
   img.onload=()=>{
    try{
     const maxSide=720,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
     const canvas=document.createElement('canvas');
     canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
     canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
     const ctx=canvas.getContext('2d');
     if(!ctx)throw new Error('Image processing is unavailable in this browser.');
     ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);
     ctx.drawImage(img,0,0,canvas.width,canvas.height);
     resolve(canvas.toDataURL('image/jpeg',0.78));
    }catch(error){reject(error)}
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

async function refreshMatched(){if(tmdbBusy)return;tmdbStop=false;tmdbBusy=true;let items=state.movies.filter(m=>m.tmdbId);let count=0;for(let i=0;i<items.length;i++){if(tmdbStop)break;let m=items[i];tmdbStatus=`Refreshing ${i+1} of ${items.length}: ${m.title}`;if(i%3===0)render();try{let x=await tmdbFetch('/movie/'+m.tmdbId+'?append_to_response=credits');applyCredits(m,x);m.tmdbOverview=x.overview||m.tmdbOverview;m.tmdbReleaseDate=x.release_date||m.tmdbReleaseDate;if(!m.manualPoster)m.posterPath=x.poster_path||m.posterPath;count++;save()}catch(e){tmdbStatus='Refresh stopped: '+e.message;break}await new Promise(r=>setTimeout(r,260))}tmdbBusy=false;tmdbStatus=`Updated ${count} movie records.`;render()}
function renderMovieInfo(){let matched=state.movies.filter(m=>m.tmdbStatus==='matched').length,review=state.movies.filter(m=>m.tmdbStatus==='review').length,pending=pendingTmdb().length,m=movie(tmdbTarget);let out=`<h2>Movie Information · TMDB</h2><p class="muted">TMDB supplies movie information and poster images. Your original collection and viewing history stay intact. No automatic refresh happens when the app opens.</p><p class="muted tmdb-small">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>`;out+=`<div class="card"><h3>TMDB Connection</h3>${getTmdbToken()?`<p>API token saved in this browser.</p><button onclick="clearTmdbToken()">Forget Token</button>`:`<label>TMDB API Read Access Token<input id="tmdbToken" type="password" autocomplete="off" placeholder="Paste your token here (not into chat)"></label><button class="primary" onclick="setTmdbToken()">Use Token in This Tab</button>`}<p class="muted tmdb-small">The token is held in this tab's session storage, not included in the HTML file or JSON backups. Do not publish a token in GitHub. A browser-only app cannot fully conceal API credentials from someone using the same browser.</p></div>`;out+=`<div class="card"><h3>Collection Lookup</h3><p>${matched} matched · ${review} need review · ${pending} not checked</p><div class="actions"><button class="primary" ${tmdbBusy||!getTmdbToken()?'disabled':''} onclick="bulkTmdb()">Look Up Remaining Movies</button><button ${tmdbBusy||!getTmdbToken()?'disabled':''} onclick="refreshMovieInfo()">Refresh Movie Information</button><button ${tmdbBusy?'disabled':''} onclick="resetTmdbReview()">Recheck All</button>${tmdbBusy?`<button onclick="stopBulkTmdb()">Stop</button>`:''}</div><p class="muted tmdb-small">Only clear title-and-year matches are accepted automatically. Ambiguous matches require your approval. Large collections may take several minutes.</p></div>`;if(tmdbStatus)out+=`<div class="notice" role="status">${esc(tmdbStatus)}</div>`;out+=`<div class="card"><h3>Find a Movie</h3><label>Choose a title from your collection<input id="tmdbMovieFilter" placeholder="Search your collection" oninput="drawTmdbMovieList(this.value)"></label><div id="tmdbMovieList"></div></div>`;if(review)out+=`<div class="card"><h3>Needs Your Review (${review})</h3>${state.movies.filter(m=>m.tmdbStatus==='review').map(m=>`<div class="row"><span class="grow">${esc(m.title)} (${esc(m.year||'?')})</span><button onclick="openTmdbSearch('${m.id}')">Review</button></div>`).join('')}</div>`;if(m){out+=`<div class="card"><h3>${esc(m.title)} (${esc(m.year||'?')})</h3>${posterHtml(m)}<p class="muted">${esc(m.tmdbOverview||'No description yet.')}</p><div class="actions"><button ${!getTmdbToken()?'disabled':''} onclick="searchTmdb('${m.id}')">Search TMDB</button><button onclick="edit('${m.id}')">Edit Details / Upload Artwork</button><button onclick="markTmdbSkipped()">Keep Manual Entry</button></div><label>Search with a different title<input id="tmdbAlternate" placeholder="Alternate title"></label><button ${!getTmdbToken()?'disabled':''} onclick="searchTmdb('${m.id}',document.getElementById('tmdbAlternate').value)">Search Alternate Title</button></div>`;if(tmdbCandidates.length){out+=`<h3>Select the correct match</h3><div class="tmdb-grid">${tmdbCandidates.map(x=>`<div class="card">${x.poster_path?`<img loading="lazy" src="https://image.tmdb.org/t/p/w185${esc(x.poster_path)}" alt="${esc(tmdbTitle(x))}">`:''}<strong>${esc(tmdbTitle(x))}</strong><p class="muted">${esc(tmdbYear(x)||'Year unknown')} · ${esc((x.genre_ids||[]).map(id=>tmdbGenreMap[id]).filter(Boolean).join(', ')||'Genre unavailable')}</p><button onclick="selectTmdbResult(${Number(x.id)})">Use This Match</button></div>`).join('')}</div>`}if(m.tmdbPosterChoices?.length){out+=`<h3>Alternative TMDB Posters</h3><div class="tmdb-grid">${m.tmdbPosterChoices.map(path=>`<div class="card"><img loading="lazy" src="https://image.tmdb.org/t/p/w185${esc(path)}" alt="Alternative poster"><button onclick="selectPoster('${esc(path)}')">Use This Poster</button></div>`).join('')}</div>`}}return out}
function drawTmdbMovieList(q=''){let el=document.getElementById('tmdbMovieList');if(!el)return;let matches=state.movies.filter(m=>m.title.toLowerCase().includes(q.toLowerCase())).slice(0,20);el.innerHTML=matches.map(m=>`<div class="row"><span class="grow">${esc(m.title)} (${esc(m.year||'?')})</span><button onclick="openTmdbSearch('${m.id}')">Find Posters</button></div>`).join('')}

function deleteMovie(id){let m=state.movies.find(x=>x.id===id);if(!m)return;if(!confirm('Remove "'+m.title+'" from My Collection? Watch History, ratings and Viewing Paths will be preserved.'))return;state.archivedMovies=state.archivedMovies||[];if(!state.archivedMovies.some(x=>x.id===id))state.archivedMovies.push(structuredClone(m));state.movies=state.movies.filter(x=>x.id!==id);state.lineup=state.lineup.filter(x=>x!==id);state.completed=state.completed.filter(x=>x!==id);editId=null;tmdbDraft=null;save();notice='Removed from My Collection. Historical records are preserved.';render()}
function restorePendingForm(){if(!pendingForm)return;for(let k of ['title','year','genre','notes','posterUrl']){let el=document.getElementById(k);if(el)el.value=pendingForm[k]}pendingForm=null}function tmdbLookupTitle(){if(tmdbModal?.mode==='add')return document.getElementById('tmdbSearchTerm')?.value||'';let m=movie(tmdbModal?.id);return document.getElementById('tmdbSearchTerm')?.value||m?.title||''}
let pendingForm=null;function openTmdbModal(mode,id=null){pendingForm={title:document.getElementById('title')?.value||'',year:document.getElementById('year')?.value||'',genre:document.getElementById('genre')?.value||'',notes:document.getElementById('notes')?.value||'',posterUrl:document.getElementById('posterUrl')?.value||''};let title=mode==='add'?(document.getElementById('title')?.value||''):(movie(id)?.title||'');tmdbModal={mode,id,term:title,loading:false,error:'',candidates:[],selected:null};tmdbPage=1;render();if(title.trim()&&getTmdbToken())runTmdbModalSearch(1)}
function closeTmdbModal(){tmdbModal=null;render();restorePendingForm()}
async function runTmdbModalSearch(page=1){if(!tmdbModal)return;let modal=tmdbModal,term=document.getElementById('tmdbSearchTerm')?.value.trim()||modal.term.trim();if(!term){modal.error='Enter a movie title to search.';render();return}modal.term=term;modal.loading=true;modal.error='';render();try{let [data,genres]=await Promise.all([tmdbFetch('/search/movie?query='+encodeURIComponent(term)+'&include_adult=false&page='+page),Object.keys(tmdbGenreMap).length?Promise.resolve(null):tmdbFetch('/genre/movie/list?language=en-US')]);if(genres)tmdbGenreMap=Object.fromEntries((genres.genres||[]).map(g=>[g.id,g.name]));if(tmdbModal!==modal)return;modal.candidates=(data.results||[]).sort((a,b)=>scoreMatch(movie(modal.id)||{title:term,year:document.getElementById('year')?.value},b)-scoreMatch(movie(modal.id)||{title:term,year:document.getElementById('year')?.value},a));tmdbPage=page;tmdbTotalPages=Math.min(data.total_pages||1,500);if(!modal.candidates.length)modal.error='No matches found. Try another title or enter details manually.'}catch(e){modal.error=e.message}finally{if(tmdbModal===modal){modal.loading=false;render()}}}
async function chooseTmdbModalResult(id){if(!tmdbModal)return;let modal=tmdbModal;modal.loading=true;modal.error='';render();try{let x=await tmdbFetch('/movie/'+id+'?append_to_response=images');if(tmdbModal!==modal)return;modal.selected={tmdbId:x.id,tmdbTitle:x.title,tmdbOverview:x.overview||'',tmdbReleaseDate:x.release_date||'',tmdbPosterChoices:(x.images?.posters||[]).slice(0,25).map(p=>p.file_path),posterPath:x.poster_path||(x.images?.posters||[])[0]?.file_path||'',posterOverride:'',manualPoster:false,tmdbStatus:'matched',tmdbReviewed:true,title:x.title,year:Number(tmdbYear(x))||'',genre:(x.genres||[]).map(g=>g.name).join(', ')};}catch(e){modal.error=e.message}finally{if(tmdbModal===modal){modal.loading=false;render()}}}
function chooseModalPoster(path){if(!tmdbModal?.selected)return;tmdbModal.selected.posterPath=path;render()}
function confirmTmdbModal(){
 let modal=tmdbModal;if(!modal?.selected)return;
 let selected=modal.selected,d={...selected};delete d.title;delete d.year;delete d.genre;
 if(modal.mode==='review'){
  let m=state.movies.find(x=>x.id===modal.id);
  if(m){Object.assign(m,d);m.title=selected.title;m.year=selected.year;m.genre=selected.genre;save()}
  tmdbModal=null;pendingForm=null;notice='TMDB match saved. Review the updated title in your collection.';render();return;
 }
 if(modal.mode==='edit')tmdbDraft=d;
 if(modal.mode==='add')addDraft=d;
 // Apply the selection only to the unsaved form, then close the modal.
 // The original collection is unchanged until the form is submitted.
 pendingForm={...(pendingForm||{}),title:selected.title,year:String(selected.year||''),genre:selected.genre,posterUrl:''};
 tmdbModal=null;
 render();
 restorePendingForm();
 let target=document.getElementById(modal.mode==='edit'?'editTmdbPreview':'addTmdbPreview');
 if(target)target.innerHTML='<p class="notice">TMDB match applied. Click '+(modal.mode==='edit'?'Save Changes':'Add to Collection')+' to keep your updates.</p>';
}

function renderTmdbModal(){let d=tmdbModal,selected=d.selected;return `<div class="tmdb-modal" role="dialog" aria-modal="true" aria-label="Find TMDB movies"><div class="tmdb-dialog"><div class="row"><h2 class="grow">Find TMDB Posters & Movie Details</h2><button type="button" onclick="closeTmdbModal()">Close ✕</button></div><p class="muted">Search and select the correct release. ${d.mode==='review'?'Confirm to save the match.':'Changes will not be saved until you save the movie form.'}</p>${!getTmdbToken()?`<p class="notice">TMDB search requires an API token. Go to Movie Info → TMDB Connection to save it once in this browser. Your current edits will stay here when you close this pop-up.</p>`:''}<form onsubmit="event.preventDefault();runTmdbModalSearch(1)"><label>Movie title<input id="tmdbSearchTerm" value="${esc(d.term)}" placeholder="Search movie title"></label><button class="primary" ${d.loading||!getTmdbToken()?'disabled':''}>Search TMDB</button></form>${d.error?`<p class="notice">${esc(d.error)}</p>`:''}${d.loading?'<p>Searching TMDB…</p>':''}${selected?`<div class="card"><h3>Selected: ${esc(selected.title)} (${esc(selected.year||'Unknown year')})</h3><p>${esc(selected.genre||'Genre unknown')}</p>${selected.posterPath?`<img style="max-width:140px" src="https://image.tmdb.org/t/p/w185${esc(selected.posterPath)}" alt="Selected poster">`:''}<p class="muted">Choose an alternate poster below, or confirm this selection.</p><div class="actions"><button class="primary" type="button" onclick="confirmTmdbModal()">Confirm This Match</button><button type="button" onclick="tmdbModal.selected=null;render()">Back to Results</button></div>${selected.tmdbPosterChoices.length?`<h3>Alternate Posters</h3><div class="tmdb-grid">${selected.tmdbPosterChoices.map(path=>`<div class="card"><img src="https://image.tmdb.org/t/p/w185${esc(path)}" alt="Alternate poster"><button type="button" onclick="chooseModalPoster('${esc(path)}')">${selected.posterPath===path?'✓ Selected':'Choose Poster'}</button></div>`).join('')}</div>`:''}</div>`:`<div class="tmdb-grid">${d.candidates.map(x=>`<div class="card">${x.poster_path?`<img loading="lazy" src="https://image.tmdb.org/t/p/w185${esc(x.poster_path)}" alt="${esc(tmdbTitle(x))} poster">`:'<div class="poster">No poster</div>'}<strong>${esc(tmdbTitle(x))}</strong><span class="muted">${esc(tmdbYear(x)||'Year unknown')}</span><span class="muted">${esc((x.genre_ids||[]).map(id=>tmdbGenreMap[id]).filter(Boolean).join(', ')||'Genre unavailable')}</span><button type="button" onclick="chooseTmdbModalResult(${Number(x.id)})">Select Match</button></div>`).join('')}</div>`}${tmdbTotalPages>1&&!selected?`<div class="actions"><button type="button" ${tmdbPage<=1||d.loading?'disabled':''} onclick="runTmdbModalSearch(${tmdbPage-1})">Previous</button><span>Page ${tmdbPage} of ${tmdbTotalPages}</span><button type="button" ${tmdbPage>=tmdbTotalPages||d.loading?'disabled':''} onclick="runTmdbModalSearch(${tmdbPage+1})">Next</button></div>`:''}<p class="muted tmdb-small">This product uses the TMDB API but is not endorsed or certified by TMDB.</p></div></div>`}

document.getElementById('restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let b=JSON.parse(await f.text());if(![6,14,15,16].includes(b.version)||!b.state||!Array.isArray(b.state.movies)||!Array.isArray(b.state.lineup)||!Array.isArray(b.state.paths))throw Error('Unrecognized backup format');if(!confirm('Replace your current collection and history with this backup?'))return;state=b.state;state.deferred=Array.isArray(state.deferred)?state.deferred:[];save();notice='Backup restored successfully. Version 29 queue settings initialized.';setTab('Collection')}catch(err){alert('Restore failed: '+err.message)}finally{e.target.value=''}});render();

async function shareWatch(key){
 const h=state.history.find(v=>(v.entryId||v.id)===key);const m=h&&movie(h.id);if(!m)return;
 const overlay=document.createElement('div');overlay.className='tmdb-modal';overlay.id='shareOverlay';
 overlay.innerHTML='<div class="tmdb-dialog" style="max-width:490px;text-align:center"><h2>Share your watch</h2><canvas id="shareCanvas" width="1080" height="1350" style="width:100%;max-width:350px;aspect-ratio:4/5;background:#090b0e;border:2px solid #e7bf38"></canvas><p id="shareStatus" class="muted">Preparing poster…</p><div class="actions" style="justify-content:center"><button class="primary" id="shareSave" disabled>Save PNG</button><button onclick="document.getElementById(\'shareOverlay\').remove()">Close</button></div></div>';
 document.body.appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()});
 const canvas=overlay.querySelector('canvas'),ctx=canvas.getContext('2d');
 ctx.fillStyle='#090b0e';ctx.fillRect(0,0,1080,1350);ctx.strokeStyle='#d7b746';ctx.lineWidth=10;ctx.strokeRect(24,24,1032,1302);
 const txt=(t,y,size,color='#e5c54a')=>{ctx.fillStyle=color;ctx.font='900 '+size+'px Impact, Arial Black, sans-serif';ctx.textAlign='center';ctx.fillText(t,540,y,990)};
 ctx.textAlign='center';ctx.font='900 91px Impact, Arial Black, sans-serif';ctx.shadowColor='#d4ad34';ctx.shadowBlur=24;txt('OLD HEAD VIDEO',164,91);ctx.shadowBlur=0;
 ctx.fillStyle='#aeb5b9';ctx.fillRect(100,210,880,3);
 ctx.fillStyle='#171c20';ctx.fillRect(240,245,600,870);
 const poster=m.posterOverride||(m.posterPath?'https://image.tmdb.org/t/p/w780'+m.posterPath:'');let img=null;
 if(poster){try{img=new Image();img.crossOrigin='anonymous';img.src=poster;await img.decode()}catch(e){img=null}}
 if(!overlay.isConnected)return;
 if(img){let ratio=Math.max(570/img.width,840/img.height),sw=570/ratio,sh=840/ratio;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,255,260,570,840)}
 else{ctx.fillStyle='#252b30';ctx.fillRect(255,260,570,840);txt('POSTER UNAVAILABLE',700,32)}

 const r=Math.max(0,Math.min(5,Math.round(Number(h.rating)||0)));txt('★'.repeat(r)+'☆'.repeat(5-r),1197,78,'#e7bf38');
 txt('BE KIND, REWIND',1290,47);
 overlay.querySelector('#shareStatus').textContent=img?'Preview ready.':'Artwork unavailable; branded card is ready.';
 const save=overlay.querySelector('#shareSave');save.disabled=false;save.onclick=()=>{try{canvas.toBlob(blob=>{if(!blob){alert('Unable to export this image.');return}const filename='old-head-video-'+m.title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png';
const download=()=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)};
const file=new File([blob],filename,{type:'image/png'});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
navigator.share({files:[file],title:'Old Head Video — '+m.title}).catch(err=>{if(err.name!=='AbortError')download()});
}else download()},'image/png')}catch(e){alert('The poster image cannot be exported due to image permissions.')}};
}
