const KEY='old-head-video-v6';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=()=>({movies:structuredClone(SEED),lineup:[],completed:[],paths:[],history:[],round:0});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(state.movies)||!Array.isArray(state.paths))throw Error()}catch(e){state=initial()}
let tab='Up Next',query='',editId=null,editPathId=null,editPathIds=[],pathSearch='',notice='',ratingPromptId=null,swapTarget=null;const tabs=['Up Next','Collection','Add VHS','History','Viewing Paths','Backup'];
const movie=id=>state.movies.find(m=>m.id===id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notice='Browser storage unavailable. Download a backup to preserve changes.'}}
function active(){return state.paths.filter(p=>p.active)}
function isMusic(m){return /music|concert|punk|rock|metal|video clip/i.test(m.genre||'')}
function bucket(m){return isMusic(m)?'music':(m.genre||'unknown').split(/[,;/]/)[0].trim().toLowerCase()}
function makeLineup(){if(state.lineup.length&&state.completed.length<state.lineup.length)return;let available=state.movies.filter(m=>!m.watched),picked=[],used=new Set(),paths=active();const ordered=p=>p.ids.map(movie).filter(m=>m&&!m.watched).sort((a,b)=>(Number(a.year)||9999)-(Number(b.year)||9999));for(const p of paths){let next=ordered(p).find(m=>!used.has(m.id));if(next&&picked.length<10){picked.push(next);used.add(next.id)}}
const seenGenre={},seenDecade={};for(const m of picked){seenGenre[bucket(m)]=(seenGenre[bucket(m)]||0)+1;seenDecade[Math.floor(Number(m.year)/10)*10]=(seenDecade[Math.floor(Number(m.year)/10)*10]||0)+1}
while(picked.length<10){let options=available.filter(m=>!used.has(m.id));if(!options.length)break;let best=null,bestScore=-Infinity;for(const m of options){let g=bucket(m),d=Math.floor(Number(m.year)/10)*10,prev=picked.at(-1),related=state.history.filter(h=>h.rating>=4).map(h=>movie(h.id)).filter(Boolean),affinity=related.some(x=>bucket(x)===g)?1.8:0,score=Math.random()*3+affinity-(seenGenre[g]||0)*4-(seenDecade[d]||0)*1.5-(prev&&bucket(prev)===g?7:0);if(score>bestScore){best=m;bestScore=score}}picked.push(best);used.add(best.id);seenGenre[bucket(best)]=(seenGenre[bucket(best)]||0)+1;seenDecade[Math.floor(Number(best.year)/10)*10]=(seenDecade[Math.floor(Number(best.year)/10)*10]||0)+1}

function setTab(t){swapTarget=null;tab=t;query='';editId=null;editPathId=null;pathSearch='';render()}
function mark(id){let m=movie(id);if(!m||m.watched)return;m.watched=true;if(!state.completed.includes(id))state.completed.push(id);state.history.unshift({id,date:new Date().toISOString().slice(0,10),rating:m.rating||0});ratingPromptId=id;save();render()}
function markPreviously(id){let m=movie(id);if(!m||m.watched)return;m.watched=true;state.history.unshift({id,date:null,previously:true,rating:m.rating||0});if(state.lineup.includes(id)&&!state.completed.includes(id))state.completed.push(id);ratingPromptId=id;save();render()}
function nextInPath(p){return sortPathIds(p.ids).map(movie).find(m=>m&&!m.watched)}
function finishRating(n){if(ratingPromptId&&n>0)rate(ratingPromptId,n);ratingPromptId=null;render()}
function rate(id,n){let m=movie(id);if(!m)return;m.rating=n;let h=state.history.find(x=>x.id===id);if(h)h.rating=n;save();render()}
function isProtected(id){return active().some(p=>p.ids.includes(id))}
function swapStart(id){if(isProtected(id)){notice='This movie is protected by an active Viewing Path.';render();return}swapTarget=swapTarget===id?null:id;render()}
function swapMovie(id,mode){let pos=state.lineup.indexOf(id);if(pos<0||isProtected(id)||movie(id)?.watched){swapTarget=null;render();return}let used=new Set(state.lineup),chosen=null;
if(mode==='path'){let paths=active(),cursor=Number(state.pathSwapCursor)||0;for(let offset=0;offset<paths.length;offset++){let index=(cursor+offset)%paths.length,p=paths[index],candidate=nextInPath(p);if(candidate&&!used.has(candidate.id)){chosen=candidate;state.pathSwapCursor=(index+1)%paths.length;break}}if(!chosen){notice='No eligible next movie is available from an active Viewing Path. Try Random instead.';render();return}}
else{let original=movie(id),options=state.movies.filter(m=>!m.watched&&!used.has(m.id)&&!isProtected(m.id));if(!options.length){notice='No eligible movies are available to swap in.';render();return}let related=state.history.filter(h=>h.rating>=4).map(h=>movie(h.id)).filter(Boolean),others=state.lineup.filter(x=>x!==id).map(movie).filter(Boolean),bestScore=-Infinity;for(let m of options){let g=bucket(m),score=Math.random()*3+(g===bucket(original)?5:0)+(related.some(x=>bucket(x)===g)?1.8:0)-others.filter(x=>bucket(x)===g).length*1.2;if(score>bestScore){bestScore=score;chosen=m}}}
state.lineup[pos]=chosen.id;swapTarget=null;save();notice='Swapped '+movie(id).title+' for '+chosen.title+'. The original remains unwatched.';render()}
function movieCard(m,idx,watch=false){return `<div class="card"><div class="row"><div class="${watch?'number':'poster'}">${watch?idx+1:'▣'}</div><div class="grow"><h3>${esc(m.title)}</h3><span class="tag">${esc(m.year||'Year unknown')}</span> <span class="muted">${esc(m.genre||'Unclassified')}</span></div></div><div class="actions">${watch?`<button class="primary" onclick="mark('${m.id}')">Mark watched</button>${!isProtected(m.id)?`<button onclick="swapStart('${m.id}')">Swap Movie</button>`:'<span class="muted">🔒 Viewing Path protected</span>'}`:''}<button onclick="edit('${m.id}')">Edit Details</button></div>${watch&&swapTarget===m.id?`<div class="notice"><b>Replace only this movie</b><div class="actions"><button onclick="swapMovie('${m.id}','random')">Swap for Random Movie</button><button onclick="swapMovie('${m.id}','path')">Swap for Viewing Path Movie</button><button onclick="swapTarget=null;render()">Cancel</button></div></div>`:''}</div>`}
function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');let out='';if(notice){out+=`<div class="notice">${esc(notice)}</div>`;notice=''}
if(editId){let m=movie(editId);out+=`<h2>Edit Details</h2><form onsubmit="updateMovie(event)"><label>Title<input id="title" required value="${esc(m.title)}"></label><label>Year<input id="year" type="number" min="1880" max="2100" value="${esc(m.year)}"></label><label>Genres<input id="genre" value="${esc(m.genre)}"></label><label>Notes<textarea id="notes">${esc(m.notes||'')}</textarea></label><button class="primary">Save Changes</button> <button type="button" onclick="editId=null;render()">Cancel</button></form>`}
else if(tab==='Up Next'){let done=state.completed.length,total=state.lineup.length;out+=`<h2>Up Next</h2><div class="notice"><b>${done} of ${total} watched</b><p class="muted">This lineup stays locked until you finish all its movies.</p></div>`;if(done===total){out+=`<p>Lineup complete! Your watched movies remain in History.</p><button class="primary" onclick="makeLineup();render()">Generate Next 10</button>`}else{out+=state.lineup.map((id,i)=>({m:movie(id),i})).filter(x=>x.m&&!x.m.watched).map(x=>movieCard(x.m,x.i,true)).join('');out+=`<p class="muted">Active viewing paths: ${active().length}. They affect the next lineup, not this one.</p>`}}
else if(tab==='Collection'){out+=`<h2>My Collection (${state.movies.length})</h2><input placeholder="Search titles, genres, years" value="${esc(query)}" oninput="query=this.value;drawCollection()"><div id="results"></div>`}
else if(tab==='Add VHS'){out+=`<h2>Add VHS</h2><form onsubmit="addMovie(event)"><label>Title<input id="title" required></label><label>Release year<input id="year" type="number" min="1880" max="2100"></label><label>Genres<input id="genre"></label><button class="primary">Add to Collection</button></form>`}
else if(tab==='History'){out+=`<h2>Watch History</h2><p class="muted">Ratings are optional. Tap a star to change a rating.</p>`;out+=state.history.length?state.history.map(h=>{let m=movie(h.id);return m?`<div class="card"><h3>${esc(m.title)}</h3><div class="muted">${h.previously||!h.date?"Previously watched · date unknown":"Watched "+esc(h.date)}</div><div class="stars">${[1,2,3,4,5].map(n=>`<button aria-label="Rate ${n} stars" onclick="rate('${m.id}',${n})">${n<=h.rating?'★':'☆'}</button>`).join('')}</div></div>`:''}).join(''):'<p>No movies marked watched yet.</p>'}
else if(tab==='Viewing Paths'){
out+=`<h2>Viewing Paths</h2><p class="muted">Your paths automatically follow release-year order (earliest first). Editing a path does not change your current locked Up Next lineup.</p>`;
if(editPathId){let p=state.paths.find(x=>x.id===editPathId);if(p){let selected=new Set(p.ids);out+=`<div class="card"><h3>Edit Viewing Path</h3><form onsubmit="updatePath(event)"><label>Path name<input id="editPathName" required value="${esc(p.name)}"></label><label>Find movies to add or remove<input id="pathSearch" placeholder="Search title or year" value="${esc(pathSearch)}" autocomplete="off"></label><p class="muted">Check titles to include them. Selected titles stay selected when you search.</p><div id="pathChoices"></div><button class="primary">Save Path</button> <button type="button" onclick="editPathId=null;pathSearch='';render()">Cancel</button></form></div>`;}}
else {out+=`<form onsubmit="addPath(event)"><label>Path name<input id="pathName" required placeholder="Full Moon Entertainment"></label><label>Select movies (hold Command on Mac to select several)<select id="pathMovies" multiple size="7">${state.movies.slice().sort((a,b)=>a.title.localeCompare(b.title)).map(m=>`<option value="${m.id}">${esc(m.title)} (${esc(m.year||'year unknown')})</option>`).join('')}</select></label><button class="primary">Create Viewing Path</button></form><hr>`;out+=state.paths.map(p=>{let ordered=sortPathIds(p.ids).map(movie).filter(Boolean);return `<div class="card"><h3>${esc(p.name)}</h3><p class="muted">${p.ids.length} selected titles · ${p.active?'Active':'Paused'} · chronological order</p><p class="muted">${nextInPath(p)?'Next in Path: '+esc(nextInPath(p).title):'All titles watched'}</p><ol>${ordered.map(m=>`<li>${esc(m.title)} (${esc(m.year||'year unknown')}) ${m.watched?'✓ Watched':nextInPath(p)?.id===m.id?'<strong>· NEXT IN PATH</strong>':''}${!m.watched?` <button type="button" onclick="markPreviously('${m.id}')">Mark Previously Watched</button>`:''}</li>`).join('')}</ol><div class="actions"><button onclick="editViewingPath('${p.id}')">Edit Path</button><button onclick="togglePath('${p.id}')">${p.active?'Pause':'Resume'}</button><button onclick="deletePath('${p.id}')">Delete</button></div></div>`}).join('')}
}
else if(tab==='Backup'){out+=`<h2>Save Your Progress</h2><p>Download a backup after edits, ratings or watched movies. This local prototype does not sync across devices.</p><div class="actions"><button class="primary" onclick="backup()">Download Backup</button><button onclick="document.getElementById('restoreFile').click()">Restore Backup</button></div><p class="muted">Version 9 uses the same saved data and backup format as Version 6. Keep your existing backup separately.</p>`}
if(ratingPromptId){let rm=movie(ratingPromptId);if(rm){out+=`<div class="rating-overlay" role="dialog" aria-modal="true" aria-label="Rate watched movie"><div class="rating-panel"><div class="muted">ADDED TO WATCH HISTORY</div><h2>How was ${esc(rm.title)}?</h2><p class="muted">Choose a rating, or skip for now. You can always rate it later in History.</p><div class="stars rating-choices">${[1,2,3,4,5].map(n=>`<button aria-label="Rate ${n} stars" onclick="finishRating(${n})">${n} ★</button>`).join('')}</div><button onclick="finishRating(0)">Skip rating</button></div></div>`}}
document.getElementById('app').innerHTML=out;if(tab==='Collection'&&!editId)drawCollection();if(tab==='Viewing Paths'&&editPathId){drawPathChoices();const searchInput=document.getElementById('pathSearch');searchInput.addEventListener('input',function(){pathSearch=this.value;drawPathChoices()});searchInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();e.stopPropagation()}})}}
function drawCollection(){let q=query.toLowerCase().trim(),matches=state.movies.filter(m=>[m.title,m.genre,m.year].join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=`<p class="muted">${matches.length} matching titles</p>`+matches.slice(0,80).map(m=>movieCard(m)).join('')+(matches.length>80?'<p class="muted">Showing first 80. Narrow your search to see more.</p>':'')}
function edit(id){editId=id;render()}
function updateMovie(e){e.preventDefault();let m=movie(editId);m.title=document.getElementById('title').value.trim();m.year=document.getElementById('year').value?Number(document.getElementById('year').value):'';m.genre=document.getElementById('genre').value.trim();m.notes=document.getElementById('notes').value;editId=null;save();notice='Changes saved in this browser. Download a backup to keep a separate copy.';render()}

function sortPathIds(ids){return ids.slice().sort((a,b)=>{let x=movie(a),y=movie(b),xa=Number(x?.year)||9999,ya=Number(y?.year)||9999;return xa-ya||(x?.title||'').localeCompare(y?.title||'')})}
function editViewingPath(id){editPathId=id;editPathIds=[...state.paths.find(x=>x.id===id).ids];pathSearch='';render()}
